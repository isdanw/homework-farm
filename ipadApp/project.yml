name: ExamPad
options:
  bundleIdPrefix: xyz.yiyo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 自签安装到自己的 iPad：Xcode 里登录 Apple ID 后选 Personal Team 即可。
    # 留空 DEVELOPMENT_TEAM 时本机 CI 编译用 CODE_SIGNING_ALLOWED=NO 覆盖（见 scripts/build-ipad.sh）。
    # 2026-10-22 真机试用：用户 Personal Team（免费证书 7 天过期，过期后重跑构建即可）
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "ADN92Z5HXK"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    ENABLE_TESTABILITY: "YES"

targets:
  ExamPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExamPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.yiyo.exampad
        PRODUCT_NAME: ExamPad
        TARGETED_DEVICE_FAMILY: "2"          # 2 = 仅 iPad
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ENABLE_PREVIEWS: "YES"
    info:
      path: ExamPad/Info.plist
      properties:
        CFBundleDisplayName: 考卷
        CFBundleIconName: "AppIcon"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ---- 云函数通道（生成工程时由 scripts/gen-ipad-project.sh 注入）----
        EXAM_API_BASE_URL: ${EXAM_API_BASE_URL}
        EXAM_HTTP_TOKEN: ${EXAM_HTTP_TOKEN}

  ExamPadTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ExamPadTests
    dependencies:
      - target: ExamPad
    settings:
      base:
        PRODUCT_NAME: ExamPadTests
        PRODUCT_BUNDLE_IDENTIFIER: xyz.yiyo.exampad.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ExamPad.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ExamPad"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ExamPad:
    build:
      targets:
        ExamPad: all
        ExamPadTests: [test]
    test:
      targets:
        - ExamPadTests
      gatherCoverageData: false
    run:
      config: Debug